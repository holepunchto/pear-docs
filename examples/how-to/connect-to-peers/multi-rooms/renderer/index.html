<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Chat Multi Rooms</title>
  <link href="./build/output.css" rel="stylesheet">
</head>

<body class="bg-neutral-950 text-neutral-100 h-screen flex font-sans antialiased">
  <aside class="w-72 border-r border-neutral-900 flex flex-col">
    <header class="px-5 py-4 border-b border-neutral-900">
      <div class="flex items-center gap-2">
        <svg style="height:1.25rem;width:auto" viewBox="0 0 265 358" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Pear">
          <path d="M123.036 0H141.964V35.3525H123.036V0Z" fill="#B0D944"/>
          <path d="M113.572 46.5399V53.6999H94.643V62.6499H170.357V53.6999H151.429V39.8274H132.5V46.5399H113.572Z" fill="#B0D944"/>
          <path d="M189.286 67.1249H132.5V73.8374H75.7144V89.9474H189.286V67.1249Z" fill="#B0D944"/>
          <path d="M208.214 94.4224H132.5V101.135H56.7858V117.245H208.214V94.4224Z" fill="#B0D944"/>
          <path d="M208.214 121.72H132.5V128.433H56.7858V144.543H208.214V121.72Z" fill="#B0D944"/>
          <path d="M227.143 149.018H132.5V155.73H37.8573V171.84H227.143V149.018Z" fill="#B0D944"/>
          <path d="M227.143 176.315H132.5V183.028H37.8573V199.138H227.143V176.315Z" fill="#B0D944"/>
          <path d="M246.071 203.613H132.5V210.325H18.9286V226.435H246.071V203.613Z" fill="#B0D944"/>
          <path d="M265 230.91H132.5V237.623H0V253.733H265V230.91Z" fill="#B0D944"/>
          <path d="M265 258.208H132.5V264.92H0V281.03H265V258.208Z" fill="#B0D944"/>
          <path d="M265 285.505H132.5V292.218H0V308.328H265V285.505Z" fill="#B0D944"/>
          <path d="M227.143 312.803H132.5V319.515H37.8573V335.625H227.143V312.803Z" fill="#B0D944"/>
          <path d="M189.286 340.1H132.5V346.812H75.7144V358H189.286V340.1Z" fill="#B0D944"/>
        </svg>
        <h1 class="text-base font-medium tracking-tight">Rooms</h1>
      </div>
    </header>
    <div class="p-3 space-y-2 border-b border-neutral-900">
      <form id="create-room" class="flex gap-2">
        <input id="room-name" autocomplete="off" placeholder="New room name"
          class="flex-1 rounded-lg bg-neutral-900 border border-neutral-800 px-3 py-1.5 text-xs text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition">
        <button type="submit"
          class="rounded-lg bg-white text-black px-3 py-1.5 text-xs font-medium hover:bg-neutral-200 transition">Create</button>
      </form>
      <form id="join-room" class="flex gap-2">
        <input id="room-invite" autocomplete="off" placeholder="Paste invite"
          class="flex-1 rounded-lg bg-neutral-900 border border-neutral-800 px-3 py-1.5 text-xs text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition">
        <button type="submit"
          class="rounded-lg bg-neutral-800 text-neutral-200 px-3 py-1.5 text-xs font-medium hover:bg-neutral-700 transition">Join</button>
      </form>
    </div>
    <nav id="rooms" class="flex-1 overflow-y-auto p-2 space-y-1">
      <div id="rooms-empty" class="text-xs text-neutral-500 text-center py-8">No rooms yet.</div>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col">
    <div id="no-room" class="flex h-full items-center justify-center text-sm text-neutral-500">
      Select or create a room.
    </div>

    <div id="room-view" class="flex-1 flex flex-col" style="display: none">
      <header class="px-6 py-4 border-b border-neutral-900">
        <div class="flex items-center justify-between gap-3">
          <h1 id="room-title" class="text-base font-medium tracking-tight"></h1>
          <button id="copy-invite" type="button" disabled
            class="rounded-full border border-neutral-800 bg-neutral-900 px-3.5 py-1.5 text-xs font-medium text-neutral-200 hover:bg-neutral-800 disabled:cursor-not-allowed disabled:opacity-40 transition">
            Copy invite
          </button>
        </div>
        <p id="room-invite-label" class="text-[11px] text-neutral-500 truncate mt-1 font-mono"></p>
      </header>
      <div id="messages" class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-2">
        <div id="messages-empty" class="m-auto text-sm text-neutral-500">No messages yet.</div>
      </div>
      <footer class="px-6 py-4 border-t border-neutral-900">
        <form id="composer" class="flex gap-2">
          <input id="input" type="text" autocomplete="off" placeholder="Type a message..."
            class="flex-1 rounded-xl border border-neutral-800 bg-neutral-900 px-4 py-2.5 text-sm text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition">
          <button id="send" type="submit" disabled
            class="rounded-xl bg-white px-5 py-2.5 text-sm font-medium text-black hover:bg-neutral-200 disabled:cursor-not-allowed disabled:opacity-30 transition">
            Send
          </button>
        </form>
      </footer>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
