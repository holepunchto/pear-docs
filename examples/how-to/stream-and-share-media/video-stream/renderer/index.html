<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Stream</title>
  <link href="./build/output.css" rel="stylesheet">
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans antialiased">
  <header class="px-6 py-4 border-b border-neutral-900 flex items-center justify-between">
    <h1 class="text-base font-medium tracking-tight">Video Stream</h1>
    <span id="count" class="text-xs text-neutral-500">0 videos</span>
  </header>

  <div id="invite-bar" class="px-6 py-3 border-b border-neutral-900 bg-neutral-900/30 hidden">
    <div class="flex items-center justify-between mb-1.5">
      <div class="text-[10px] uppercase tracking-wider text-neutral-500">Invite</div>
      <button id="copy" class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-neutral-100 transition">Copy</button>
    </div>
    <code id="invite" class="block font-mono text-xs text-neutral-300 break-all leading-relaxed select-all"></code>
  </div>

  <div class="max-w-4xl mx-auto p-6 space-y-6">
    <div id="dropzone"
      class="rounded-2xl border-2 border-dashed border-neutral-800 bg-neutral-900/50 p-8 text-center transition hover:border-neutral-700">
      <p class="text-sm text-neutral-400">
        Drop videos here, or <label for="fileInput" class="cursor-pointer text-neutral-100 underline">browse</label>
      </p>
      <input type="file" multiple class="hidden" id="fileInput">
    </div>

    <div id="videos" class="space-y-3">
      <div id="empty" class="text-sm text-neutral-500 text-center py-12">No videos yet.</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
