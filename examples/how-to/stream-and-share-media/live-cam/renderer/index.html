<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Cam</title>
  <link href="./build/output.css" rel="stylesheet">
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans antialiased">
  <header class="px-6 py-4 border-b border-neutral-900 flex items-center gap-3">
    <svg style="height:1.25rem;width:auto" viewBox="0 0 265 358" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Pear">
      <path d="M123.036 0H141.964V35.3525H123.036V0Z" fill="#B0D944"/>
      <path d="M113.572 46.5399V53.6999H94.643V62.6499H170.357V53.6999H151.429V39.8274H132.5V46.5399H113.572Z" fill="#B0D944"/>
      <path d="M189.286 67.1249H132.5V73.8374H75.7144V89.9474H189.286V67.1249Z" fill="#B0D944"/>
      <path d="M208.214 94.4224H132.5V101.135H56.7858V117.245H208.214V94.4224Z" fill="#B0D944"/>
      <path d="M208.214 121.72H132.5V128.433H56.7858V144.543H208.214V121.72Z" fill="#B0D944"/>
      <path d="M227.143 149.018H132.5V155.73H37.8573V171.84H227.143V149.018Z" fill="#B0D944"/>
      <path d="M227.143 176.315H132.5V183.028H37.8573V199.138H227.143V176.315Z" fill="#B0D944"/>
      <path d="M246.071 203.613H132.5V210.325H18.9286V226.435H246.071V203.613Z" fill="#B0D944"/>
      <path d="M265 230.91H132.5V237.623H0V253.733H265V230.91Z" fill="#B0D944"/>
      <path d="M265 258.208H132.5V264.92H0V281.03H265V258.208Z" fill="#B0D944"/>
      <path d="M265 285.505H132.5V292.218H0V308.328H265V285.505Z" fill="#B0D944"/>
      <path d="M227.143 312.803H132.5V319.515H37.8573V335.625H227.143V312.803Z" fill="#B0D944"/>
      <path d="M189.286 340.1H132.5V346.812H75.7144V358H189.286V340.1Z" fill="#B0D944"/>
    </svg>
    <h1 class="text-base font-medium tracking-tight">Live Cam</h1>
    <span id="role" class="rounded-full bg-neutral-800 px-2 py-0.5 text-[10px] uppercase tracking-wider text-neutral-400 hidden"></span>
    <span id="recording" class="ml-auto inline-flex items-center gap-1.5 text-xs text-neutral-400 hidden">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
      Recording
    </span>
  </header>

  <div id="invite-bar" class="px-6 py-3 border-b border-neutral-900 bg-neutral-900/30 hidden">
    <div class="flex items-center justify-between mb-1.5">
      <div class="text-[10px] uppercase tracking-wider text-neutral-500">Invite</div>
      <button id="copy" class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-neutral-100 transition">Copy</button>
    </div>
    <code id="invite" class="block font-mono text-xs text-neutral-300 break-all leading-relaxed select-all"></code>
  </div>

  <div id="capture-error" class="px-6 py-2 border-b border-rose-900/50 bg-rose-950/40 text-xs text-rose-300 hidden"></div>

  <!-- Off-screen preview keeps the camera stream actively decoded so MediaRecorder gets frames. -->
  <video id="preview" autoplay muted playsinline style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px"></video>

  <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <div class="rounded-2xl border border-neutral-800 bg-neutral-900 overflow-hidden">
        <video id="player" controls autoplay muted class="w-full aspect-video bg-black"></video>
      </div>
    </div>
    <aside class="rounded-2xl border border-neutral-800 bg-neutral-900 p-4 flex flex-col gap-3 max-h-[80vh]">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-medium text-neutral-200">Chat</h2>
        <span id="count" class="text-xs text-neutral-500">0</span>
      </div>
      <div id="messages" class="flex-1 overflow-y-auto space-y-2 min-h-0">
        <div id="empty" class="text-xs text-neutral-500 text-center py-8">No messages yet.</div>
      </div>
      <form id="composer" class="flex gap-2">
        <input id="input" type="text" autocomplete="off" placeholder="Type a comment..."
          class="flex-1 rounded-xl border border-neutral-800 bg-neutral-950 px-3 py-2 text-sm text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition">
        <button id="send" type="submit" disabled
          class="rounded-xl bg-white px-4 py-2 text-sm font-medium text-black hover:bg-neutral-200 disabled:opacity-30 transition">
          Send
        </button>
      </form>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
