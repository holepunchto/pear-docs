<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Backup</title>
  <link href="./build/output.css" rel="stylesheet">
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans antialiased">
  <header class="px-6 py-4 border-b border-neutral-900 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="./pear-logo.svg" alt="Pear" style="height:1.25rem;width:auto" />
      <h1 class="text-base font-medium tracking-tight">Photo Backup</h1>
    </div>
    <span id="count" class="text-xs text-neutral-500">0 items</span>
  </header>

  <div id="invite-bar" class="px-6 py-3 border-b border-neutral-900 bg-neutral-900/30 hidden">
    <div class="flex items-center justify-between mb-1.5">
      <div class="text-[10px] uppercase tracking-wider text-neutral-500">Invite</div>
      <button id="copy" class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-neutral-100 transition">Copy</button>
    </div>
    <code id="invite" class="block font-mono text-xs text-neutral-300 break-all leading-relaxed select-all"></code>
  </div>

  <div class="max-w-5xl mx-auto p-6 space-y-6">
    <div id="dropzone"
      class="rounded-2xl border-2 border-dashed border-neutral-800 bg-neutral-900/50 p-8 text-center transition hover:border-neutral-700">
      <p class="text-sm text-neutral-400">
        Drop photos or videos here, or
        <label for="fileInput" class="cursor-pointer text-neutral-100 underline">browse</label>
      </p>
      <input id="fileInput" type="file" multiple class="hidden">
    </div>

    <div id="empty" class="text-sm text-neutral-500 text-center py-12">No items yet.</div>

    <div id="gallery" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-5 gap-3"></div>

    <div id="player" class="hidden space-y-4">
      <button id="back"
        class="rounded-lg bg-neutral-900 border border-neutral-800 px-3 py-1.5 text-xs text-neutral-300 hover:bg-neutral-800 transition">
        &larr; Back to gallery
      </button>
      <div id="playerMedia" class="rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800"></div>
      <form id="composer" class="flex gap-2">
        <input id="input" type="text" autocomplete="off" placeholder="Type a comment..."
          class="flex-1 rounded-xl border border-neutral-800 bg-neutral-900 px-4 py-2.5 text-sm text-neutral-100 placeholder:text-neutral-500 focus:border-neutral-600 focus:outline-none transition">
        <button id="send" type="submit" disabled
          class="rounded-xl bg-white px-5 py-2.5 text-sm font-medium text-black hover:bg-neutral-200 disabled:cursor-not-allowed disabled:opacity-30 transition">
          Send
        </button>
      </form>
      <div id="comments" class="space-y-2"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
