# Sentence-case headings with Pear/Bare/API terms exempted from the lowercase check.
extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: warning
scope: heading
match: $sentence
indicators:
  - ":"
exceptions:
  - Android
  - Autobase
  - Azure
  - Bare
  - BroadcastChannel
  - CLI
  - Comparator
  - Corestore
  - Cosmos
  - DatabaseSync
  - Docker
  - Electron
  - Emmet
  - Expo
  - FormData
  - gRPC
  - HMAC
  - HeapSnapshot
  - Hyperbee
  - Hypercore
  - HyperDHT
  - Hyperdrive
  - Hyperswarm
  - I
  - iOS
  - JavaScript
  - JSON
  - Keet
  - Kubernetes
  - Linux
  - macOS
  - Marketplace
  - MDNS
  - MongoDB
  - Native
  - Node
  - OTA
  - P2P
  - Pear
  - React
  - REPL
  - RPC
  - RPCOutgoingRequest
  - Studio
  - TypeScript
  - URLSearchParams
  - URLs
  - URL
  - Visual
  - VS
  - WebCrypto
  - WHATWG
  - Windows
