name: Watch boilerplate upstreams

# The docs vendor read-only snapshots of the hello-pear-* boilerplates under
# examples/getting-started/ and import code from them with remark-code-import
# (```js file=<rootDir>/examples/getting-started/<name>/...). GitHub won't let
# us subscribe to another org's repo events, so instead of a true webhook
# "watcher" this job polls each upstream's branch on a schedule (the default
# branch, or `ref` where a snapshot tracks a non-default branch) and opens a
# tracking issue when a vendored copy falls behind upstream — the cue to
# refresh it and re-check the imported line ranges. Most entries below track
# a whole vendored *directory* snapshot (`path`); the `hello-pear-worker`
# entry instead tracks one deliberately-reshaped *file* — the inlined copy of
# its `index.js` at `examples/getting-started/hello-pear-electron/workers/main.js`
# (see that snapshot's README) — via `file` instead of `path`, which also
# swaps in file-appropriate wording for the tracking issue it files.
#
# When you refresh a snapshot, bump the matching `pinned` SHA below AND the
# snapshot's provenance record — that is the bespoke README for snapshots whose
# README this repo authors (hello-pear-bare, hello-pear-electron), or SNAPSHOT.md
# for snapshots that vendor upstream's own README verbatim (hello-pear-daemon). The
# next run sees no drift and auto-closes the issue.
#
# The four Bluetooth snapshots under examples/how-to/connect-over-bluetooth/
# (bare-bluetooth, bare-bluetooth-android, bare-bluetooth-apple,
# bare-mobile-doctor) are partial, documentation-only copies. Each is pinned to
# the commit the Bluetooth guides describe, and the poll below compares the
# whole upstream repository's HEAD, so expect a tracking issue whenever one of
# these repositories moves. Most of that drift won't touch the imported files:
# re-check the `#L…` ranges, then re-pin.

on:
  schedule:
    # Weekly, Mondays 09:00 UTC. Boilerplate drift isn't urgent; bump the
    # cadence here if you want prompter notice.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hello-pear-bare
            repo: holepunchto/hello-pear-bare
            pinned: 5f28cc15c370c86ed64ae65e542a1b28be902211
            path: examples/getting-started/hello-pear-bare
          - name: hello-pear-electron
            repo: holepunchto/hello-pear-electron
            pinned: ed067ea5d8a9b22a98a879789ef8b56bfc4acbd2
            path: examples/getting-started/hello-pear-electron
          - name: hello-pear-react-native
            repo: holepunchto/hello-pear-react-native
            pinned: 133069a53527e7b6fa6721f1bb6ed1d4eeb0b168
            path: examples/getting-started/hello-pear-react-native
          - name: hello-pear-qvac-tui
            repo: holepunchto/hello-pear-qvac-tui
            pinned: cf7515cad71ae7022414a3bb8f511bc6ffb25ca8
            path: examples/how-to/add-on-device-ai/hello-pear-qvac-tui
          - name: bare-bluetooth
            repo: holepunchto/bare-bluetooth
            pinned: face14d724877cdab86602e1a866ed52612814e6
            path: examples/how-to/connect-over-bluetooth/bare-bluetooth
          - name: bare-bluetooth-android
            repo: holepunchto/bare-bluetooth-android
            pinned: 473e942edffad6635e0bfdec71ec9ff701b4b5a9
            path: examples/how-to/connect-over-bluetooth/bare-bluetooth-android
          - name: bare-bluetooth-apple
            repo: holepunchto/bare-bluetooth-apple
            pinned: 8376d1ea62cc63c2557769be1d79ec87c6a05de8
            path: examples/how-to/connect-over-bluetooth/bare-bluetooth-apple
          - name: bare-mobile-doctor
            repo: holepunchto/bare-mobile-doctor
            pinned: 966bc663ef318033abda6a97866db962c9e3a9d1
            path: examples/how-to/connect-over-bluetooth/bare-mobile-doctor
          - name: hello-pear-daemon
            repo: holepunchto/hello-pear-daemon
            pinned: 701ffe072e097abf81a68a79c779b8e94430637e
            path: examples/getting-started/hello-pear-daemon
          # holepunchto/hello-pear-worker is not vendored as a directory
          # snapshot — only workers/main.js above is an inlined, deliberately
          # reshaped copy of its index.js (see that README's "Deliberate
          # deviations from upstream"). It sets `file` instead of `path`,
          # which the shell step below uses to swap in file-appropriate
          # wording for the tracking issue.
          - name: hello-pear-worker
            repo: holepunchto/hello-pear-worker
            pinned: c6371f0f1014616622eece86d7432d33814975fd
            file: examples/getting-started/hello-pear-electron/workers/main.js
    steps:
      - name: Compare upstream HEAD to the vendored snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
          NAME: ${{ matrix.name }}
          PINNED: ${{ matrix.pinned }}
          VENDOR_PATH: ${{ matrix.path }}
          # Empty for snapshots vendored from the default branch; a branch name
          # for any snapshot that tracks a non-default branch.
          REF: ${{ matrix.ref }}
          # Set only for the single-file hello-pear-worker entry; empty (and
          # unused) for the directory-snapshot entries, which use VENDOR_PATH
          # instead.
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail

          branch="${REF:-$(gh api "repos/${REPO}" --jq '.default_branch')}"
          head_sha=$(gh api "repos/${REPO}/commits/${branch}" --jq '.sha')
          title="Refresh vendored snapshot: ${NAME}"

          # An open tracking issue for this snapshot, if one already exists
          # (exact title match) — keeps reruns from filing duplicates.
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title \
            | jq -r --arg t "${title}" 'map(select(.title == $t)) | (.[0].number // empty)')

          if [ "${head_sha}" = "${PINNED}" ]; then
            echo "${NAME}: in sync (${head_sha})."
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
                --comment "Vendored snapshot is back in sync with upstream \`${head_sha}\`. Closing."
            fi
            exit 0
          fi

          echo "${NAME}: drift — pinned ${PINNED}, upstream ${head_sha}."
          if [ -n "${existing}" ]; then
            echo "Tracking issue #${existing} already open; nothing to do."
            exit 0
          fi

          compare="https://github.com/${REPO}/compare/${PINNED}...${head_sha}"

          if [ -n "${FILE:-}" ]; then
            # Single-file entry (hello-pear-worker): no vendored directory,
            # and the refresh is a deliberate re-inline, not a plain copy —
            # word the issue accordingly instead of the directory phrasing.
            body=$(printf '%s\n' \
              "[\`${REPO}\`](https://github.com/${REPO}) has new commits since \`${FILE}\` was last synced to it." \
              "" \
              "- Pinned: \`${PINNED}\`" \
              "- Upstream \`${branch}\`: \`${head_sha}\`" \
              "- Changes: ${compare}" \
              "" \
              "\`${FILE}\` is an inlined copy of \`${REPO}\`'s \`index.js\`, deliberately reshaped rather than left as upstream's two-line \`require('hello-pear-worker')\` — see that file's snapshot README, \"Deliberate deviations from upstream\". To refresh:" \
              "" \
              "1. Re-inline \`${branch}\`'s \`index.js\` at \`${head_sha}\` into \`${FILE}\`, preserving the deliberate deviations described in the README (do not replace it with a plain \`require('hello-pear-worker')\`)." \
              "2. Re-check the \`#L…\` ranges in the \`.mdx\` that imports from \`${FILE}\` — a shifted range fails silently." \
              "3. Run \`npm run check:workers-in-sync\`, and copy \`${FILE}\` byte-for-byte over any \`examples/**/workers/main.js\` copy it reports as drifted." \
              "4. Update the \`pinned\` SHA for \`${NAME}\` in \`.github/workflows/watch-boilerplates.yml\`." \
              "" \
              "_Opened automatically by the Watch boilerplate upstreams workflow._")
          else
            body=$(printf '%s\n' \
              "[\`${REPO}\`](https://github.com/${REPO}) has new commits since the snapshot vendored at \`${VENDOR_PATH}\`." \
              "" \
              "- Pinned: \`${PINNED}\`" \
              "- Upstream \`${branch}\`: \`${head_sha}\`" \
              "- Changes: ${compare}" \
              "" \
              "The docs import code from this snapshot via \`remark-code-import\`. To refresh:" \
              "" \
              "1. Copy the imported upstream files into \`${VENDOR_PATH}\` from \`${branch}\` at \`${head_sha}\`, keeping any deliberate local deviations (e.g. the placeholder \`upgrade\` link in \`package.json\`)." \
              "2. Re-check the \`#L…\` ranges in the importing \`.mdx\` — a shifted range fails silently." \
              "3. Update the \`pinned\` SHA for \`${NAME}\` in \`.github/workflows/watch-boilerplates.yml\` and the snapshot's provenance record (its bespoke \`README.md\`, or \`SNAPSHOT.md\` where the README is vendored from upstream)." \
              "4. Re-run the snapshot's scenario: \`npm run test:examples -- --filter=${NAME}\` (if one exists)." \
              "" \
              "_Opened automatically by the Watch boilerplate upstreams workflow._")
          fi

          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
