name: Build LLM docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'SUMMARY.md'
      - 'scripts/build-llm-docs.js'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - run: node scripts/build-llm-docs.js

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-docs
          path: |
            llms.txt
            llms-full.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90
