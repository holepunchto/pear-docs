name: Build LLM docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'SUMMARY.md'
      - 'scripts/build-llm-docs.js'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: holepunchto/actions/node-base@9e4364b9534e8eb0a1c6b8a7be95f19ecf86046e # v1

      - run: node scripts/build-llm-docs.js

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-docs
          path: |
            llms.txt
            llms-full.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90
