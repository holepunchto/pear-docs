name: Notify index build

# Kicks the search index build as soon as `published` moves, instead of leaving
# it to that repo's 30-minute poll.
#
# The race this has to avoid: merging to `published` starts the site deploy, but
# the corpus this workflow describes is not live until that deploy finishes. A
# bare "go now" ping would make the index builder fetch the PREVIOUS corpus,
# embed it, and then sit idle believing it is current.
#
# So the ping carries the hash it expects. This job regenerates the corpus from
# the merge commit — deterministic, and cheap enough (~0.1s) that it costs
# nothing — and sends that hash along. The builder waits until the live docs
# site actually serves it before spending 10-40 minutes embedding.
#
# The builder's schedule stays as the safety net: if the token below is missing
# or expired, or this job fails, the index still updates within 30 minutes.

on:
  push:
    branches:
      - published
    paths:
      # Only content can move the corpus hash. Everything else in a deploy —
      # styling, components, config — leaves it byte-identical, and the builder
      # would just no-op. Skip the ping entirely for those.
      - 'content/**'
      - 'examples/**'
      - 'scripts/generate-mcp-corpus.ts'
      - 'scripts/helpers.ts'
  workflow_dispatch:

jobs:
  notify:
    name: ping the index builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Same isolated-install pattern as the docs-lint jobs: package.json pulls
      # token-gated @tetherto/* packages this repo's token cannot read, so
      # install only what the generator needs.
      - name: Install generator deps
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/gen" tsx github-slugger
          mkdir -p node_modules
          cp -R "$RUNNER_TEMP/gen/node_modules/." node_modules/

      - name: Compute the corpus hash for this commit
        id: corpus
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsx scripts/generate-mcp-corpus.ts
          echo "hash=$(jq -r .corpusHash out/mcp/manifest.json)" >> "$GITHUB_OUTPUT"

      # Absent token = no ping, not a red X. The builder's schedule covers it,
      # and a permanently failing workflow on every merge is worse than a
      # slower index.
      - name: Check for the dispatch token
        id: token
        run: |
          if [ -n "${{ secrets.INDEX_BUILD_DISPATCH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::INDEX_BUILD_DISPATCH_TOKEN is not set — skipping the ping. The index will still rebuild on its own schedule, just later."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch to the index builder
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.INDEX_BUILD_DISPATCH_TOKEN }}
          # owner/repo of the search service. A repo variable so a fork can
          # point this at its own builder without editing the workflow.
          TARGET: ${{ vars.INDEX_BUILD_REPO || 'tetherto/qvac-docs-search' }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET/dispatches" \
            -f event_type=docs-published \
            -F "client_payload[corpusHash]=${{ steps.corpus.outputs.hash }}" \
            -F "client_payload[commit]=${{ github.sha }}"
          echo "✓ Pinged $TARGET to build ${{ steps.corpus.outputs.hash }}"
