name: Examples

# Smoke-tests most examples under examples/:
#   - desktop-build:    the 9 Electron/Pear desktop apps (npm install + build).
#   - terminal-examples: the 16 terminal Bare apps, grouped into 9 scenarios,
#                        run on the latest Bare runtime with output assertions.
#
# Both matrices are hardcoded, so a new example app or a new scenario in
# scripts/test-examples.ts is NOT picked up automatically — add it below too, or
# it silently never runs in CI. Of the 29 app dirs under examples/, four are
# deliberately uncovered here: the hyperblobs writer/reader pair, keet-identity-key,
# and publish-a-changelog have no scenario in scripts/test-examples.ts.

on:
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'scripts/test-examples.ts'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'scripts/test-examples.ts'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

jobs:
  desktop-build:
    name: build ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - getting-started/chat
          - getting-started/pear-chat
          - how-to/blind-peering/add-blind-peering-to-a-chat-app
          - how-to/stream-and-share-media/file-sharing
          - how-to/manage-identity/keet-identity
          - how-to/stream-and-share-media/live-cam
          - how-to/connect-to-peers/multi-rooms
          - how-to/stream-and-share-media/photo-backup
          - how-to/stream-and-share-media/video-stream
    env:
      # The build is display-free (tailwind + esbuild); we never launch Electron,
      # so skip the (large) Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The repo .npmrc references ${GITHUB_TOKEN} for the @tetherto registry.
      # The examples use only public packages, so an empty token parses fine.
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: examples/${{ matrix.dir }}
        run: npm install --no-audit --no-fund
      - name: Build (if a build script exists)
        working-directory: examples/${{ matrix.dir }}
        run: npm run build --if-present

  terminal-examples:
    name: run ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # The three vendored hello-pear-bare snapshots. These boot a real
          # pear-runtime host with `--no-updates`, so they stay off the network.
          - hello-pear-bare
          - hello-pear-bare-single-thread
          - hello-pear-bare-daemon
          - hyperdht-chat
          - hyperswarm-chat
          - hypercore-replicate
          - corestore-multi
          - hyperbee-kv
          - hyperdrive-fs
          # Pure codegen under plain `node` — no Bare runtime, no network.
          # Guards the HRPC guide's imported snippets: an invalid registration
          # fails the build script rather than shipping to the page.
          - hrpc-codegen
    env:
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the latest Bare runtime and tsx
        run: npm i -g bare-runtime tsx
      - name: Run scenario
        run: tsx scripts/test-examples.ts --filter=${{ matrix.scenario }}
