name: Examples

# Smoke-tests most examples under examples/:
#   - desktop-build:    the 9 Electron/Pear desktop apps (npm install + build).
#   - terminal-examples: 22 terminal app dirs (21 Bare apps plus the node-only
#                        HRPC codegen project), grouped into 13 scenarios in
#                        scripts/test-examples.ts. 12 of them run here with
#                        output assertions: 11 against a pinned Bare runtime
#                        version (see the install step below), and
#                        hrpc-codegen under plain node.
#
# Both matrices are hardcoded, so a new example app or a new scenario in
# scripts/test-examples.ts is NOT picked up automatically — add it below too, or
# it silently never runs in CI. Of the 29 app dirs under examples/, four are
# deliberately uncovered here: the hyperblobs writer/reader pair, keet-identity-key,
# and publish-a-changelog have no scenario in scripts/test-examples.ts.
#
# desktop-build maps 1:1 onto the Pear/Bare nav-tree split
# (docs/plans/PEAR-BARE-SPLIT-PITCH.md): every entry backs a `product: pear`
# how-to page. terminal-examples is mixed, not purely Bare-tab content — see
# the per-job comments below. Comment-only labeling (Phase 5), no matrix
# change; a physical examples/{pear,bare} split is explicitly deferred to a
# separate RFC (Phase 6 in that doc).
#
# hello-pear-qvac-tui is different: it DOES have a scenario (test-examples.ts
# runs its vendored app's own headless test suite), but that scenario is
# deliberately NOT in the matrix below — upstream already runs this exact
# suite on every push, across five platforms. Full rationale in its
# `ciSkipReason` in scripts/test-examples.ts. Use it locally instead:
#   npm run test:examples -- --filter=hello-pear-qvac-tui

on:
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      # Not in this workflow's matrix — see the hello-pear-qvac-tui paragraph
      # above — so its own changes shouldn't trigger this workflow either.
      - '!examples/how-to/add-on-device-ai/hello-pear-qvac-tui/**'
      - 'scripts/test-examples.ts'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - '!examples/how-to/add-on-device-ai/hello-pear-qvac-tui/**'
      - 'scripts/test-examples.ts'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

jobs:
  # Pear-only: every entry here backs a chat-app how-to page tagged
  # `product: pear` (the "Extend your chat app" grouping, plus the two
  # getting-started tutorials) — none of these are Bare-tab content.
  desktop-build:
    name: build ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - getting-started/chat
          - getting-started/pear-chat
          - how-to/blind-peering/add-blind-peering-to-a-chat-app
          - how-to/stream-and-share-media/file-sharing
          - how-to/manage-identity/keet-identity
          - how-to/stream-and-share-media/live-cam
          - how-to/connect-to-peers/multi-rooms
          - how-to/stream-and-share-media/photo-backup
          - how-to/stream-and-share-media/video-stream
    env:
      # The build is display-free (tailwind + esbuild); we never launch Electron,
      # so skip the (large) Electron binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The repo .npmrc references ${GITHUB_TOKEN} for the @tetherto registry.
      # The examples use only public packages, so an empty token parses fine.
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: examples/${{ matrix.dir }}
        run: npm install --no-audit --no-fund
      - name: Build (if a build script exists)
        working-directory: examples/${{ matrix.dir }}
        run: npm run build --if-present

  # Mixed, not purely Bare-tab content: the three hello-pear-bare scenarios
  # below run through the `bare` CLI harness like everything else in this job,
  # but they exercise the `hello-pear-bare` template — the Pear-on-Bare/OTA
  # path (`product: pear`, see the getting-started/from-a-template pages), not
  # a Bare-only tutorial. The remaining eight scenarios back the pure-logic
  # how-to pages tagged `product: bare` (Connect to peers, Store and
  # replicate, Stream and share media's Bare-side guides).
  terminal-examples:
    name: run ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # The three vendored hello-pear-bare snapshots. These boot a real
          # pear-runtime host with `--no-updates`, so they stay off the network.
          - hello-pear-bare
          - hello-pear-bare-single-thread
          - hello-pear-bare-daemon
          # hello-pear-qvac-tui is deliberately absent — see the header
          # comment above.
          - hyperdht-chat
          - hyperswarm-chat
          - hypercore-replicate
          - corestore-multi
          - hyperbee-kv
          - autobase-multiwriter
          - autobee-multiwriter
          - hyperdrive-fs
          # Pure codegen under plain `node` — no Bare runtime, no network.
          # Guards the HRPC guide's imported snippets: an invalid registration
          # fails the build script rather than shipping to the page.
          - hrpc-codegen
    env:
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned, not latest, so a new Bare release cannot turn the whole matrix
      # red unannounced. Bump it deliberately after running every scenario
      # against the new version.
      #
      # History: bare-runtime 1.33.0 switched its internal module resolver to
      # bare-module v7, which bare-worker@4.4.0 doesn't support — every
      # worker-based scenario failed with "defaultProtocol.postresolve is not a
      # function" — so this stayed on 1.32.0. bare-worker 4.5.0 fixes it, and
      # the vendored hello-pear-bare lockfile now resolves 4.5.0. Verified
      # 2026-10-05: all 13 scenarios pass on 1.34.1.
      - name: Install Bare runtime and tsx
        run: npm i -g bare-runtime@1.34.1 tsx
      - name: Run scenario
        run: tsx scripts/test-examples.ts --filter=${{ matrix.scenario }}
