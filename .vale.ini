# Vale configuration — prose linting for the docs under content/.
#
# The Google developer-documentation style package is fetched by `vale sync`,
# which errata-ai/vale-action runs automatically in CI (see
# .github/workflows/docs-lint.yml). Run `vale sync` once locally to lint here.
#
# We pin the package version below and the Vale binary version in the workflow
# so local runs match CI exactly — "latest" drifts and can fail CI with no code
# change when a new rule lands. StylesPath points at .github/styles/ for rule
# overrides (Prose/Headings.yml) layered on top of the synced package.
StylesPath = .github/styles

# Only error-level alerts fail CI; warnings and suggestions surface as
# annotations. Raise to `warning` once the prose is clean if you want them
# to gate too.
MinAlertLevel = error

# Pinned to v0.6.3 — bump deliberately, and re-run `vale sync && vale content`
# locally to catch any new rules before they reach CI.
Packages = https://github.com/vale-cli/Google/releases/download/v0.6.3/Google.zip

# MDX is a Markdown superset — lint it with the Markdown parser so JSX,
# frontmatter, and code fences are handled the same as in .md files.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Google, Prose

# Rules disabled because they conflict with this project's house style or
# misfire on technical content rather than catching real prose defects:
#   Units    — flags config/time literals like `7d` and `60s`
#   Spacing  — flags dotted API identifiers as missing-space typos
#   LyHyphens — false-positives on paths like "_delta-only-..."
#   Headings — replaced by Prose.Headings (Pear/Bare/API term exceptions)
#   EmDash   — house style permits spaced em-dashes (` — `) per code review
Google.Units = NO
Google.Spacing = NO
Google.LyHyphens = NO
Google.Headings = NO
Google.EmDash = NO
